app = "sentinelhealth-wachenje"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.prod"

[deploy]
  release_command = "alembic upgrade head"

[env]
  ENV = "production"
  LOG_LEVEL = "INFO"
  PYTHONUNBUFFERED = "1"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
