<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SentinelHealth — Department Head</title>
<link rel="stylesheet" href="/static/animations.css?v=131">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
<style>
  body { background-color: #0f172a; color: #f8fafc; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: .75rem; }
  .card-title { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
  .pulse-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10b981; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
</style>
</head>
<body class="antialiased pb-12">

<header class="border-b border-slate-800 bg-slate-900 sticky top-0 z-20">
  <div class="mx-auto max-w-7xl flex flex-wrap items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-3">
      <div class="grid h-8 w-8 place-items-center rounded-lg bg-indigo-600 text-sm font-bold text-white">S</div>
      <div>
        <p class="text-sm font-bold">Department Head</p>
        <p class="text-[11px] text-slate-400" id="headerSub">Loading...</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <span class="flex items-center gap-2 rounded-md bg-slate-800 px-3 py-1.5 text-xs text-slate-300">
        <span class="pulse-dot"></span>Live
      </span>
      <button onclick="Auth.logout()" class="rounded-md border border-slate-700 hover:bg-slate-800 px-3 py-1.5 text-xs text-rose-400">Sign out</button>
    </div>
  </div>
</header>

<main class="mx-auto max-w-7xl px-4 py-6 space-y-6">

  <!-- KPIs -->
  <section class="grid gap-3 sm:grid-cols-4 sh-stagger">
    <div class="card p-4">
      <p class="card-title mb-1">Department WVI</p>
      <p id="kpi-wvi" class="text-3xl font-bold">--</p>
    </div>
    <div class="card p-4">
      <p class="card-title mb-1">Pending Confirmations</p>
      <p id="kpi-pending" class="text-3xl font-bold text-amber-400">--</p>
    </div>
    <div class="card p-4">
      <p class="card-title mb-1">Reports Today</p>
      <p id="kpi-reports" class="text-3xl font-bold">--</p>
    </div>
    <div class="card p-4">
      <p class="card-title mb-1">Confirmed Today</p>
      <p id="kpi-confirmed" class="text-3xl font-bold text-emerald-400">--</p>
    </div>
  </section>

  <!-- AI SUPERVISOR INSIGHTS -->
  <div class="card p-5 border-l-4 border-l-indigo-500">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="text-lg">🧠</span>
        <h2 class="text-sm font-bold text-slate-200">Supervisor AI</h2>
      </div>
      <button id="analyzeBtn" onclick="analyzeQueue()" class="rounded bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 text-xs font-bold">
        Analyze Queue
      </button>
    </div>
    <div id="ai-insights" class="text-sm text-slate-300 leading-relaxed">
      <span class="animate-pulse text-slate-500">Loading department summary...</span>
    </div>
  </div>

  <!-- TWO COLUMNS -->
  <div class="grid gap-6 lg:grid-cols-2">
    <!-- CONFIRMATION QUEUE -->
    <section class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="card-title">Fatigue Confirmation Queue</h2>
        <span id="queue-count" class="text-xs text-slate-500"></span>
      </div>
      <div id="queue" class="space-y-2 max-h-[500px] overflow-y-auto pr-2 sh-stagger"></div>
    </section>

    <!-- TREND -->
    <section class="card p-5">
      <h2 class="card-title mb-3">30-Day Department Trend</h2>
      <div id="trend" class="h-48 flex items-end gap-1"></div>
    </section>
  </div>

</main>

<script src="/static/ui.js?v=131"></script>
<script src="/static/auth.js?v=131"></script>
<script src="/static/animations.js?v=131"></script>
<script src="/static/admin-dept-head.js?v=131"></script>
</body>
</html>
