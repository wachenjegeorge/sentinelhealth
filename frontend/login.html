<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050912" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SentinelHealth" />
<title>SentinelHealth - Sign in</title>
<link rel="manifest" href="/static/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/static/icon.svg" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { background: #050912; min-height: 100vh; color: #e2e8f0;
         font-family: ui-sans-serif, system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center;
         padding: 1rem; padding-top: env(safe-area-inset-top); }
  .card { background: rgba(17,26,43,.72); border: 1px solid rgba(94,130,180,.18);
          border-radius: 1rem; backdrop-filter: blur(14px); width: 100%;
          max-width: 24rem; padding: 1.5rem; }
  .field { background: #0f1a2c; border: 1px solid #253553; color: #e2e8f0;
           border-radius: .5rem; padding: .65rem .8rem; width: 100%;
           font-size: .9rem; }
  .field:focus { outline: none; border-color: #22d3ee; }
  .btn { background: linear-gradient(90deg, #22d3ee, #3b82f6); color: #050912;
         border-radius: .6rem; padding: .75rem 1rem; font-weight: 600;
         width: 100%; cursor: pointer; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .err { background: rgba(244,63,94,.1); border: 1px solid rgba(244,63,94,.4);
         color: #fda4af; border-radius: .5rem; padding: .5rem .75rem;
         font-size: .85rem; }
  .hidden { display: none; }
</style>
  <link rel="stylesheet" href="/static/glass.css">
</head>
<body>
<div class="card space-y-5">
  <div class="flex items-center gap-3">
    <div class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 text-base font-black text-slate-950">S</div>
    <div>
      <h1 class="text-lg font-semibold">SentinelHealth Kenya</h1>
      <p class="text-xs text-slate-500">Sign in to your facility</p>
    </div>
  </div>
  <form id="loginForm" class="space-y-3">
    <div>
      <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Username</label>
      <input id="username" class="field" autocomplete="username" required />
    </div>
    <div>
      <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Password</label>
      <input id="password" type="password" class="field" autocomplete="current-password" required />
    </div>
    <div id="error" class="err hidden"></div>
    <button type="submit" id="submit" class="btn">Sign in</button>

  <div class="relative py-2">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
    <div class="relative flex justify-center"><span class="bg-slate-900 px-2 text-[10px] text-slate-500 uppercase">Or</span></div>
  </div>
  <div id="g_id_onload" data-client_id="399955673061-l9mro2955u4i8ht2t2hm12cn9bf90aaa.apps.googleusercontent.com" data-callback="handleGoogleLogin"></div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left" data-width="320"></div>

  </form>
  <div id="demo-creds" class="text-[11px] text-slate-500 border-t border-slate-800 pt-3 space-y-1">
    <p>Demo credentials:</p>
    <p><code class="text-cyan-400">officer-nairobi</code> / <code class="text-cyan-400">worker-mombasa-1</code></p>
    <p>Password: <code class="text-cyan-400">DemoPass2026!</code></p>
    <p class="pt-2">No account? <a href="/register" class="text-cyan-400">Create one</a></p>
  </div>
</div>
<script src="/static/auth.js"></script>
<script>
(function() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
  const existing = Auth.readSession();
  if (existing) {
    window.location.href = Auth.getRedirectPath(existing.role);
    return;
  }
  const f = document.getElementById("loginForm");
  const errBox = document.getElementById("error");
  const btn = document.getElementById("submit");
  f.addEventListener("submit", async function(e) {
    e.preventDefault();
    errBox.classList.add("hidden");
    btn.disabled = true; btn.textContent = "Signing in...";
    try {
      const res = await fetch("/api/bff/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        }),
      });
      if (!res.ok) {
        const body = await res.json().catch(function() { return {}; });
        throw new Error(body.detail || "Invalid credentials");
      }
      const data = await res.json();
      Auth.saveSession(data);
      window.location.href = Auth.getRedirectPath(data.role);
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove("hidden");
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });


  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    var dc = document.getElementById("demo-creds");
    if (dc) dc.style.display = "none";
  }

  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { var dc = document.getElementById("demo-creds"); if (dc) dc.style.display = "none"; }
  window.handleGoogleLogin = async (response) => {
    try {
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      const res = await fetch("/api/bff/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ google_sub: payload.sub, email: payload.email, id_token: response.credential })
      });
      if (!res.ok) throw new Error("Google login failed");
      const data = await res.json();
      Auth.saveSession(data);
      window.location.href = Auth.getRedirectPath(data.role);
    } catch (e) {
      const err = document.getElementById("error");
      err.textContent = e.message;
      err.classList.remove("hidden");
    }
  };

})();
</script>
  <script src="/static/glass.js" defer></script>
</body>
</html>
