<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SentinelHealth - Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
<style>
  body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; width: 100%; max-width: 36rem; padding: 2rem; }
  .field { background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem 0.8rem; width: 100%; color: white; font-size: 0.9rem; }
  .field:focus { outline: none; border-color: #22d3ee; }
  .btn { background: linear-gradient(90deg, #22d3ee, #3b82f6); color: #050912; border-radius: 0.6rem; padding: 0.75rem 1rem; font-weight: 600; width: 100%; cursor: pointer; }
</style>
  <link rel="stylesheet" href="/static/glass.css">
</head>
<body class="antialiased p-4">

<div class="card space-y-5">
  <div class="flex items-center gap-3">
    <div class="grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 text-base font-black text-slate-950">S</div>
    <div><h1 class="text-lg font-bold">Create your account</h1>
      <p class="text-xs text-slate-400">Approval by your supervisor is required.</p></div>
  </div>

  <div id="error" class="hidden bg-rose-500/10 border border-rose-500/50 text-rose-400 rounded-lg p-3 text-sm"></div>
  <div id="success" class="hidden bg-emerald-500/10 border border-emerald-500/50 text-emerald-400 rounded-lg p-3 text-sm"></div>

  <!-- Google Signup -->
  <div id="google-signup-container">
    <div id="g_id_onload"
         data-client_id="399955673061-l9mro2955u4i8ht2t2hm12cn9bf90aaa.apps.googleusercontent.com"
         data-callback="handleGoogleSignup"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin w-full flex justify-center"
         data-type="standard" data-size="large" data-theme="filled_black"
         data-text="signup_with" data-shape="rectangular" data-logo_alignment="left" data-width="340">
    </div>
  </div>

  <div class="relative py-2" id="divider">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
    <div class="relative flex justify-center"><span class="bg-[#1e293b] px-2 text-[10px] text-slate-500 uppercase">Or fill manually</span></div>
  </div>

  <form id="form" class="space-y-3">
    <!-- Step 1: County → Level → Facility -->
    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label class="text-xs uppercase text-slate-400 mb-1 block">County</label>
        <select id="county" class="field" required><option value="">Select county...</option></select>
      </div>
      <div>
        <label class="text-xs uppercase text-slate-400 mb-1 block">KEPH Level</label>
        <select id="keph_level" class="field" required>
          <option value="">All levels</option>
          <option value="1">Level 1 — Community Health Unit</option>
          <option value="2">Level 2 — Dispensary / Clinic</option>
          <option value="3">Level 3 — Health Centre</option>
          <option value="4">Level 4 — Sub-County Hospital</option>
          <option value="5">Level 5 — County Referral</option>
          <option value="6">Level 6 — National Hospital</option>
        </select>
      </div>
    </div>

    <div>
      <label class="text-xs uppercase text-slate-400 mb-1 block">Facility</label>
      <select id="facility_id" class="field" required><option value="">Select county first...</option></select>
    </div>

    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label class="text-xs uppercase text-slate-400 mb-1 block">Role</label>
        <select id="role" class="field">
          <option value="worker">Worker (Nurse, Clinical Officer, CHP)</option>
          <option value="department_head">Department Head / In-charge</option>
          <option value="hospital_head">Hospital Head / Superintendent</option>
          <option value="county_officer">County Officer</option>
        </select>
      </div>
      <div>
        <label class="text-xs uppercase text-slate-400 mb-1 block">Department</label>
        <select id="primary_department" class="field"><option value="">Select facility first...</option></select>
      </div>
    </div>

    <div><label class="text-xs uppercase text-slate-400 mb-1 block">Full Name</label><input id="full_name" class="field" required></div>
    <div><label class="text-xs uppercase text-slate-400 mb-1 block">Username</label><input id="username" class="field" required pattern="[a-zA-Z0-9_-]+" title="Letters, numbers, dash, underscore only"></div>
    <div><label class="text-xs uppercase text-slate-400 mb-1 block">Password (min 8)</label><input id="password" type="password" class="field" required minlength="8"></div>
    <div class="grid gap-3 sm:grid-cols-2">
      <div><label class="text-xs uppercase text-slate-400 mb-1 block">Email</label><input id="email" type="email" class="field"></div>
      <div><label class="text-xs uppercase text-slate-400 mb-1 block">Phone</label><input id="phone" class="field" placeholder="+254..."></div>
    </div>

    <button type="submit" class="btn mt-2">Create account</button>
  </form>

  <p class="text-xs text-center text-slate-500">
    Already have an account? <a href="/" class="text-cyan-400">Sign in</a>
  </p>
</div>

<script src="/static/ui.js?v=200"></script>
<script src="/static/auth.js?v=200"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);

  // Load counties from facilities
  (async function loadCounties() {
    const res = await fetch("/api/bff/facilities");
    const data = await res.json();
    const counties = [...new Set(data.facilities.map(f => f.county))].sort();
    $("county").innerHTML = '<option value="">Select county...</option>' +
      counties.map(c => `<option value="${c}">${c} County</option>`).join("");
  })();

  // County change → load facilities
  $("county").onchange = async () => {
    const county = $("county").value;
    if (!county) return;
    const res = await fetch(`/api/bff/facilities?county=${encodeURIComponent(county)}`);
    const data = await res.json();
    window._allFacilities = data.facilities;
    filterFacilities();
  };

  // Level change → filter facilities
  $("keph_level").onchange = filterFacilities;

  function filterFacilities() {
    const level = $("keph_level").value;
    let facs = window._allFacilities || [];
    if (level) facs = facs.filter(f => String(f.keph_level) === level);
    $("facility_id").innerHTML = facs.map(f =>
      `<option value="${f.id}" data-level="${f.keph_level}">${f.name} (Level ${f.keph_level})</option>`
    ).join("");
  }

  // Facility change → load departments
  $("facility_id").onchange = () => {
    const opt = $("facility_id").selectedOptions[0];
    const level = parseInt(opt.dataset.level);
    const levelDepts = {
      1: ["Community Health"],
      2: ["Outpatient (OPD)", "Pharmacy"],
      3: ["Outpatient (OPD)", "Maternity", "Laboratory", "Pharmacy"],
      4: ["Emergency Department", "Outpatient (OPD)", "Maternity", "Paediatrics", "Nursing Wards", "Laboratory", "Pharmacy"],
      5: ["Emergency Department", "ICU / Critical Care", "Maternity", "Paediatrics", "Outpatient (OPD)", "Laboratory", "Radiology", "Pharmacy", "Nursing Wards", "Kitchen & Laundry", "Community Health"],
      6: ["Emergency Department", "ICU / Critical Care", "Maternity", "Paediatrics", "Outpatient (OPD)", "Laboratory", "Radiology", "Pharmacy", "Nursing Wards", "Kitchen & Laundry", "Community Health", "Administration"]
    };
    const depts = levelDepts[level] || [];
    $("primary_department").innerHTML = '<option value="">Select department...</option>' +
      depts.map(d => `<option>${d}</option>`).join("");
  };

  // Google signup
  window.handleGoogleSignup = (response) => {
    try {
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(window.atob(base64));
      $("full_name").value = payload.name || payload.given_name || "";
      $("email").value = payload.email || "";
      if (!$("username").value) {
        $("username").value = payload.email.split('@')[0].replace(/[^a-zA-Z0-9]/g, '') + Math.floor(Math.random()*1000);
      }
      $("google-signup-container").classList.add("hidden");
      $("divider").classList.add("hidden");
      UI.toast("Google account connected. Complete the form.");
      $("password").focus();
    } catch (e) {
      UI.toast("Failed to read Google account", "error");
    }
  };

  // Submit
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const err = $("error"), ok = $("success");
    err.classList.add("hidden"); ok.classList.add("hidden");

    const role = $("role").value;
    const endpointMap = {
      "worker": "/api/bff/auth/register/worker",
      "department_head": "/api/bff/auth/register/department-head",
      "hospital_head": "/api/bff/auth/register/hospital-head",
      "county_officer": "/api/bff/auth/register/county-officer",
    };

    const body = {
      username: $("username").value.trim(),
      password: $("password").value,
      full_name: $("full_name").value.trim(),
      email: $("email").value.trim() || null,
      phone: $("phone").value.trim() || null,
      facility_id: $("facility_id").value,
      role: role,
      primary_department: $("primary_department").value || null,
    };

    try {
      const r = await fetch(endpointMap[role], {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "Registration failed");
      ok.textContent = "Account created successfully! Wait for your supervisor to approve it.";
      ok.classList.remove("hidden");
      $("form").reset();
    } catch (e) {
      err.textContent = e.message;
      err.classList.remove("hidden");
    }
  };
})();
</script>
  <script src="/static/glass.js" defer></script>
</body>
</html>
