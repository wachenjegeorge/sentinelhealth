<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SentinelHealth - Manage Facilities</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
<style>
  body { background-color: #0f172a; color: #f8fafc; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  .field { background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.6rem 0.8rem; width: 100%; color: white; }
  .field:focus { outline: none; border-color: #22d3ee; }
</style>
  <link rel="stylesheet" href="/static/glass.css">
</head>
<body class="antialiased pb-12">
<header class="border-b border-slate-800 bg-slate-900 sticky top-0 z-20">
  <div class="mx-auto max-w-5xl flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-3">
      <a href="/admin" class="rounded-md border border-slate-700 px-2 py-1 text-xs text-slate-300 hover:bg-slate-800">← Back</a>
      <div><p class="text-sm font-bold">Facility Management</p><p class="text-[11px] text-slate-400" id="headerSub">Loading...</p></div>
    </div>
  </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-6 space-y-6">
  <div class="grid gap-6 md:grid-cols-3">
    <!-- Add Form -->
    <div class="card p-5 md:col-span-1 h-fit">
      <h2 class="text-sm font-bold text-slate-200 mb-4">Add New Facility</h2>
      <form id="facForm" class="space-y-3">
        <div><label class="text-[10px] uppercase text-slate-500 mb-1 block">Facility Name</label><input id="f-name" required class="field"></div>
        <div>
          <div id="county-row">
          <label class="text-[10px] uppercase text-slate-500 mb-1 block">County (admin only)</label>
          <select id="f-county" class="field">
            <option value="">Auto (your county)</option>
            <option>Nairobi</option><option>Mombasa</option><option>Kisumu</option>
            <option>Nakuru</option><option>Kiambu</option><option>Machakos</option>
            <option>Kakamega</option><option>Meru</option><option>Kisii</option>
            <option>Turkana</option><option>Garissa</option><option>Kilifi</option>
            <option>Kwale</option><option>Taita-Taveta</option><option>Lamu</option>
          </select>
        </div>
        <div><label class="text-[10px] uppercase text-slate-500 mb-1 block">KEPH Level</label>
          <select id="f-level" class="field">
            <option value="2">Level 2 - Dispensary</option>
            <option value="3">Level 3 - Health Centre</option>
            <option value="4">Level 4 - Sub-County Hospital</option>
            <option value="5">Level 5 - County Referral</option>
          </select>
        </div>
        <div>
          <label class="text-[10px] uppercase text-slate-500 mb-1 block">Facility Type</label>
          <select id="f-type" class="field">
            <option>Dispensary</option><option>Health Centre</option>
            <option>Sub-County Hospital</option><option>County Referral</option>
          </select>
        </div>
        <div><label class="text-[10px] uppercase text-slate-500 mb-1 block">Sub-County (Optional)</label><input id="f-sub" class="field"></div>
        <button type="submit" class="w-full rounded bg-cyan-600 hover:bg-cyan-500 py-2 text-sm font-bold text-white mt-2">Add Facility</button>
      </form>
    </div>

    <!-- List -->
    <div class="card p-5 md:col-span-2">
      <h2 class="text-sm font-bold text-slate-200 mb-4">Facilities in Your County</h2>
      <div id="facList" class="space-y-2 max-h-[600px] overflow-y-auto pr-2"></div>
    </div>
  </div>
</main>

<script src="/static/ui.js?v=100"></script>
<script src="/static/auth.js?v=100"></script>
<script>
(function() {
  const session = Auth.requireRole(["county_officer", "health_officer", "admin"]);
  if (!session) return;
  const $ = id => document.getElementById(id);
  $("headerSub").textContent = session.county ? (session.county + " County") : "National";

  async function loadFacilities() {
    const qs = session.county ? ("?county=" + encodeURIComponent(session.county)) : "";
    const res = await Auth.apiFetch("/api/bff/facilities" + qs);
    const d = await res.json();
    $("facList").innerHTML = d.facilities.map(f => `
      <div onclick="openFacilityDetail('${f.id}', '${f.name.replace(/'/g, '')}')" class="flex justify-between items-center p-3 bg-slate-800 hover:bg-slate-700 rounded-lg cursor-pointer transition">
        <div><p class="font-medium text-slate-200 text-sm">${f.name}</p><p class="text-[10px] text-slate-500">Level ${f.keph_level} • ${f.facility_type}</p></div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-400">${f.id}</span>
          <span class="text-cyan-400 text-xs">→</span>
        </div>
      </div>
    `).join("");
  }

  $("facForm").onsubmit = async (e) => {
    e.preventDefault();
    const res = await Auth.apiFetch("/api/bff/facilities", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2)) },
      body: JSON.stringify({
        name: $("f-name").value, keph_level: parseInt($("f-level").value),
        facility_type: $("f-type").value, sub_county: $("f-sub").value
      })
    });
    if (res.ok) { UI.toast("Facility added"); $("facForm").reset(); loadFacilities(); }
    else { UI.toast("Failed to add facility", "error"); }
  };

  loadFacilities();

  let currentFacilityId = null;

  window.openFacilityDetail = async function(facilityId, facilityName) {
    currentFacilityId = facilityId;
    const modal = document.getElementById('facility-detail-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('fd-name').textContent = facilityName;
    document.getElementById('fd-meta').textContent = facilityId;
    const body = document.getElementById('fd-body');
    body.innerHTML = '<p class="text-slate-400 animate-pulse">Loading departments...</p>';

    try {
      const res = await Auth.apiFetch('/api/bff/admin/intel/facility/' + encodeURIComponent(facilityId) + '/departments');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      const depts = d.departments || [];

      if (depts.length === 0) {
        body.innerHTML = '<div class="text-center py-8"><p class="text-slate-400 text-sm">No department data clears k≥5 yet.</p><p class="text-xs text-slate-500 mt-2">Need 5+ verified check-ins per department.</p></div>';
        return;
      }

      const deptList = depts.map(dept => {
        const color = dept.wvi >= 65 ? '#f43f5e' : dept.wvi >= 35 ? '#fbbf24' : '#34d399';
        return '<div class="flex justify-between items-center p-3 rounded-lg bg-slate-800/60 border border-slate-700/50">' +
          '<div><p class="text-sm font-semibold text-slate-200">' + dept.department + '</p>' +
          '<p class="text-[10px] text-slate-500">' + dept.reports + ' reports · fatigue ' + dept.avg_fatigue + '/10 · heat ' + dept.avg_heat + '/10</p></div>' +
          '<div class="text-right"><p class="text-lg font-bold" style="color:' + color + '">' + dept.wvi + '</p>' +
          '<p class="text-[9px] uppercase text-slate-500">' + dept.level + '</p></div></div>';
      }).join('');

      const deptOptions = depts.map(d => '<option>' + d.department + '</option>').join('');

      body.innerHTML = '<div class="space-y-2 mb-4">' + deptList + '</div>' +
        '<div class="border-t border-slate-700 pt-4">' +
        '<h4 class="text-xs uppercase tracking-widest text-fuchsia-400 mb-3">Send Recommendation to Hospital Head</h4>' +
        '<div class="space-y-2">' +
        '<select id="rec-dept" class="field"><option value="">Whole facility</option>' + deptOptions + '</select>' +
        '<select id="rec-sev" class="field"><option value="low">Low severity</option><option value="medium" selected>Medium</option><option value="high">High severity</option></select>' +
        '<input id="rec-subj" class="field" placeholder="Subject (e.g., Increase ICU night coverage)" maxlength="120">' +
        '<textarea id="rec-msg" class="field" rows="4" placeholder="Message to the hospital head..." maxlength="2000"></textarea>' +
        '<button onclick="sendRecommendation()" class="w-full rounded-lg bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold py-2.5 text-sm transition">Send to Hospital Head</button>' +
        '</div></div>';
    } catch (e) {
      body.innerHTML = '<p class="text-rose-400">Failed: ' + e.message + '</p>';
    }
  };

  window.closeFacilityDetail = function() {
    const m = document.getElementById('facility-detail-modal');
    m.classList.add('hidden');
    m.classList.remove('flex');
    currentFacilityId = null;
  };

  window.sendRecommendation = async function() {
    const subject = document.getElementById('rec-subj').value.trim();
    const message = document.getElementById('rec-msg').value.trim();
    const severity = document.getElementById('rec-sev').value;
    const dept = document.getElementById('rec-dept').value || null;

    if (!subject || subject.length < 3) return UI.toast('Subject required', 'error');
    if (!message || message.length < 10) return UI.toast('Message must be ≥10 chars', 'error');

    const key = crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random());
    try {
      const res = await Auth.apiFetch('/api/bff/admin/recommendations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Idempotency-Key': key },
        body: JSON.stringify({
          facility_id: currentFacilityId, subject: subject, message: message,
          severity: severity, department: dept,
        }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      UI.toast('Recommendation sent');
      closeFacilityDetail();
    } catch (e) {
      UI.toast('Failed: ' + e.message, 'error');
    }
  };

})();
</script>
  <script src="/static/glass.js" defer></script>

<div id="facility-detail-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto">
    <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center sticky top-0 bg-slate-900 z-10">
      <div>
        <p class="text-xs uppercase tracking-widest text-cyan-400">Facility Detail</p>
        <h3 class="text-lg font-bold text-white" id="fd-name">Loading...</h3>
        <p class="text-xs text-slate-500" id="fd-meta"></p>
      </div>
      <button onclick="closeFacilityDetail()" class="text-slate-400 hover:text-white text-xl">✕</button>
    </div>
    <div class="p-5 space-y-4" id="fd-body">
      <p class="text-slate-400 text-sm">Loading departments...</p>
    </div>
  </div>
</div>

</body>
</html>
